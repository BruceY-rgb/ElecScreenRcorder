<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recording Overlay</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #12121f;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        user-select: none;
        overflow: hidden;
      }
      .overlay {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        background: #12121f;
        border: 1px solid rgba(255, 255, 255, 0.06);
        color: #e8e8f0;
        font-size: 14px;
        height: 80px;
        -webkit-app-region: drag;
      }
      .indicator {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #00d4aa;
        flex-shrink: 0;
      }
      .indicator.recording {
        background: #ff4060;
        animation: pulse 1.5s ease-in-out infinite;
      }
      .indicator.paused {
        background: #ffaa00;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      .info {
        flex: 1;
      }
      .status {
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 1px;
      }
      .status.recording { color: #ff4060; }
      .status.paused { color: #ffaa00; }
      .status.ready { color: #00d4aa; }
      .status.finished { color: #00d4aa; }
      .duration {
        font-family: 'Consolas', 'Courier New', monospace;
        font-size: 16px;
        font-weight: 600;
      }
      .buttons {
        display: flex;
        gap: 6px;
        -webkit-app-region: no-drag;
      }
      .btn {
        width: 30px;
        height: 30px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 12px;
        transition: all 0.2s ease;
      }
      .btn:hover { opacity: 0.85; transform: scale(1.05); }
      .btn-pause { background: rgba(255, 170, 0, 0.8); }
      .btn-resume { background: rgba(0, 212, 170, 0.8); }
      .btn-stop { background: rgba(255, 64, 96, 0.8); }
      .btn-play { background: rgba(0, 136, 255, 0.8); }
    </style>
  </head>
  <body>
    <div class="overlay">
      <div class="indicator" id="indicator"></div>
      <div class="info">
        <div class="status ready" id="status">READY</div>
        <div class="duration" id="duration">00:00</div>
      </div>
      <div class="buttons">
        <button class="btn btn-play" id="playBtn" style="display:none" title="Play Video">&#9654;</button>
        <button class="btn btn-pause" id="pauseBtn" style="display:none">||</button>
        <button class="btn btn-resume" id="resumeBtn" style="display:none">&#9654;</button>
        <button class="btn btn-stop" id="stopBtn">&#9632;</button>
      </div>
    </div>
    <script>
      const indicator = document.getElementById('indicator');
      const statusEl = document.getElementById('status');
      const durationEl = document.getElementById('duration');
      const pauseBtn = document.getElementById('pauseBtn');
      const resumeBtn = document.getElementById('resumeBtn');
      const stopBtn = document.getElementById('stopBtn');
      const playBtn = document.getElementById('playBtn');

      let duration = 0;
      let lastVideoPath = '';

      // Listen for status updates
      window.electronAPI.onRecordingStatus((status) => {
        console.log('Status update:', status);
        updateUI(status.state, status.duration);
      });

      // Listen for recording finished
      window.electronAPI.onRecordingFinish((result) => {
        console.log('Recording finished:', result);
        lastVideoPath = result.videoPath;
        // Show play button when recording finishes
        playBtn.style.display = 'flex';
      });

      function updateUI(state, dur) {
        duration = dur || 0;
        updateDuration();

        indicator.className = 'indicator';
        statusEl.className = 'status';
        pauseBtn.style.display = 'none';
        resumeBtn.style.display = 'none';
        playBtn.style.display = 'none';

        if (state === 'recording') {
          indicator.classList.add('recording');
          statusEl.classList.add('recording');
          statusEl.textContent = 'REC';
          pauseBtn.style.display = 'flex';
        } else if (state === 'paused') {
          indicator.classList.add('paused');
          statusEl.classList.add('paused');
          statusEl.textContent = 'PAUSED';
          resumeBtn.style.display = 'flex';
        } else {
          statusEl.classList.add('ready');
          statusEl.textContent = 'READY';
        }
      }

      function updateDuration() {
        const seconds = Math.floor(duration / 1000);
        const minutes = Math.floor(seconds / 60);
        const secs = seconds % 60;
        durationEl.textContent = minutes.toString().padStart(2, '0') + ':' + secs.toString().padStart(2, '0');
      }

      pauseBtn.onclick = () => window.electronAPI.pauseRecording();
      resumeBtn.onclick = () => window.electronAPI.resumeRecording();
      stopBtn.onclick = () => window.electronAPI.stopRecording();
      playBtn.onclick = () => {
        if (lastVideoPath) {
          window.electronAPI.openVideo(lastVideoPath);
        }
      };
    </script>
  </body>
</html>
