<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recording Overlay</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        user-select: none;
        overflow: hidden;
        height: 100%;
        margin: 0;
        padding: 0;
      }
      .overlay {
        position: relative;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        background: #12121f;
        border: 1px solid rgba(255, 255, 255, 0.06);
        color: #e8e8f0;
        font-size: 14px;
        height: 90px;
        -webkit-app-region: drag;
      }
      .full-content {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        height: 100%;
        -webkit-app-region: drag;
      }
      .full-content .buttons {
        -webkit-app-region: no-drag;
      }

      /* === Collapsed mode: 36x36 transparent orb === */
      .overlay.collapsed {
        width: 36px;
        height: 36px;
        padding: 0;
        border-radius: 50%;
        background: transparent;
        border: none;
        box-shadow: none;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: grab;
        -webkit-app-region: drag;
      }
      .overlay.collapsed:active {
        cursor: grabbing;
      }

      /* Hover expanded: full overlay */
      .overlay.collapsed.hovered {
        width: 300px;
        height: 90px;
        border-radius: 0;
        background: #12121f;
        border: 1px solid rgba(255, 255, 255, 0.06);
        padding: 12px 16px;
        cursor: default;
      }

      /* Collapsed: hide full-content, show collapsed-content */
      .overlay.collapsed .full-content { display: none; }
      .overlay.collapsed .collapsed-content { display: flex; }

      /* Collapsed + hovered: show full-content, hide collapsed-content */
      .overlay.collapsed.hovered .full-content { display: flex; }
      .overlay.collapsed.hovered .collapsed-content { display: none; }

      .collapsed-content {
        display: none;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      /* === Glowing orb indicator (20px) === */
      .collapsed-indicator {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        flex-shrink: 0;
        background: radial-gradient(circle, #00ffd0 0%, #00d4aa 40%, #0088ff 80%, transparent 100%);
        box-shadow: 0 0 12px rgba(0, 180, 216, 0.6), 0 0 24px rgba(0, 136, 255, 0.3);
        -webkit-app-region: no-drag;
        cursor: pointer;
      }
      .collapsed-indicator.recording {
        background: radial-gradient(circle, #ff6080 0%, #ff4060 60%, transparent 100%);
        box-shadow: 0 0 12px rgba(255, 64, 96, 0.7), 0 0 24px rgba(255, 64, 96, 0.4);
        animation: orb-pulse 2s ease-in-out infinite;
      }
      .collapsed-indicator.paused {
        background: radial-gradient(circle, #ffcc00 0%, #ffaa00 60%, transparent 100%);
        box-shadow: 0 0 12px rgba(255, 170, 0, 0.6), 0 0 24px rgba(255, 170, 0, 0.3);
        animation: none;
      }
      @keyframes orb-pulse {
        0%, 100% {
          box-shadow: 0 0 12px rgba(255,64,96,0.7), 0 0 24px rgba(255,64,96,0.4);
          transform: scale(1);
        }
        50% {
          box-shadow: 0 0 16px rgba(255,64,96,0.8), 0 0 32px rgba(255,64,96,0.5), 0 0 0 8px rgba(255,64,96,0);
          transform: scale(1.05);
        }
      }

      /* Hide duration and state text in collapsed mode (orb only) */
      .overlay.collapsed .collapsed-duration,
      .overlay.collapsed .collapsed-state { display: none; }

      .collapsed-duration {
        font-family: 'Consolas', 'Courier New', monospace;
        font-size: 14px;
        font-weight: 600;
        color: #e8e8f0;
        letter-spacing: 1px;
      }
      .collapsed-state {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1px;
        color: #00d4aa;
        opacity: 0.8;
      }
      .collapsed-state.recording { color: #ff4060; }
      .collapsed-state.paused { color: #ffaa00; }

      /* === Expanded mode elements === */
      .indicator {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #00d4aa;
        flex-shrink: 0;
      }
      .indicator.recording {
        background: #ff4060;
        animation: pulse 1.5s ease-in-out infinite;
      }
      .indicator.paused {
        background: #ffaa00;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      .info {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 2px;
        min-width: 0;
      }
      .info-row-primary {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .info-row-secondary {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .status {
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 1px;
      }
      .status.recording { color: #ff4060; }
      .status.paused { color: #ffaa00; }
      .status.ready { color: #00d4aa; }
      .status.finished { color: #00d4aa; }
      .duration {
        font-family: 'Consolas', 'Courier New', monospace;
        font-size: 16px;
        font-weight: 600;
      }
      .details {
        font-size: 11px;
        color: #888;
      }
      .mouse-activity {
        font-size: 11px;
        color: #888;
      }
      .input-status {
        position: absolute;
        bottom: 2px;
        left: 12px;
        right: 12px;
        display: flex;
        gap: 4px;
        font-size: 10px;
        pointer-events: none;
      }
      .mouse-activity span {
        color: #ff4060;
        font-weight: 600;
      }
      .input-badge {
        padding: 1px 4px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.1);
      }
      .input-badge.active {
        background: rgba(255, 64, 96, 0.6);
        color: #fff;
      }
      .buttons {
        display: flex;
        gap: 6px;
        -webkit-app-region: no-drag;
      }
      .btn {
        width: 30px;
        height: 30px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 12px;
        transition: all 0.2s ease;
      }
      .btn:hover { opacity: 0.85; transform: scale(1.05); }
      .btn-pause { background: rgba(255, 170, 0, 0.8); }
      .btn-resume { background: rgba(0, 212, 170, 0.8); }
      .btn-stop { background: rgba(255, 64, 96, 0.8); }
      .btn-play { background: rgba(0, 136, 255, 0.8); }
      .btn-collapse { background: rgba(136, 136, 136, 0.6); }
      .btn-collapse:hover { background: rgba(170, 170, 170, 0.8); }
    </style>
  </head>
  <body>
    <div class="overlay" id="overlay">
      <div class="collapsed-content">
        <div class="collapsed-indicator" id="collapsedIndicator"></div>
        <span class="collapsed-duration" id="collapsedDuration">00:00</span>
        <span class="collapsed-state" id="collapsedState">READY</span>
      </div>
      <div class="full-content">
        <div class="indicator" id="indicator"></div>
        <div class="info">
          <div class="info-row-primary">
            <span class="status ready" id="status">READY</span>
            <span class="duration" id="duration">00:00</span>
          </div>
          <div class="info-row-secondary">
            <span class="details" id="details"></span>
            <span class="mouse-activity" id="mouseActivity"></span>
          </div>
        </div>
        <div class="buttons">
          <button class="btn btn-collapse" id="collapseBtn" title="Collapse to ball">&#9660;</button>
          <button class="btn btn-play" id="playBtn" style="display:none" title="Play Video">&#9654;</button>
          <button class="btn btn-pause" id="pauseBtn" style="display:none">||</button>
          <button class="btn btn-resume" id="resumeBtn" style="display:none">&#9654;</button>
          <button class="btn btn-stop" id="stopBtn">&#9632;</button>
        </div>
      </div>
      <div class="input-status" id="inputStatus"></div>
    </div>
    <script>
      console.log('[OVERLAY] Script loading...');

      const overlay = document.getElementById('overlay');
      const indicator = document.getElementById('indicator');
      const collapsedIndicator = document.getElementById('collapsedIndicator');
      const statusEl = document.getElementById('status');
      const durationEl = document.getElementById('duration');
      const collapsedDuration = document.getElementById('collapsedDuration');
      const detailsEl = document.getElementById('details');
      const mouseActivityEl = document.getElementById('mouseActivity');
      const inputStatusEl = document.getElementById('inputStatus');
      const pauseBtn = document.getElementById('pauseBtn');
      const resumeBtn = document.getElementById('resumeBtn');
      const stopBtn = document.getElementById('stopBtn');
      const playBtn = document.getElementById('playBtn');
      const collapsedState = document.getElementById('collapsedState');
      const collapseBtn = document.getElementById('collapseBtn');

      let duration = 0;
      let lastVideoPath = '';
      let currentResolution = null;
      let currentFps = null;
      let currentInputState = null;
      let currentMode = 'expanded';

      // Listen for mode changes from main process
      window.electronAPI.onOverlayMode((data) => {
        console.log('[OVERLAY] Mode change received:', data.mode);
        setMode(data.mode);
      });

      // Double-click collapsed overlay to expand to full mode
      overlay.addEventListener('dblclick', (e) => {
        if (currentMode === 'collapsed') {
          overlay.classList.remove('hovered');
          setMode('expanded');
          window.electronAPI.setOverlayMode('expanded');
        }
      });

      // Hover events: expand orb to full overlay on mouseenter, collapse on mouseleave
      overlay.addEventListener('mouseenter', () => {
        if (currentMode === 'collapsed') {
          overlay.classList.add('hovered');
          window.electronAPI.setOverlayHoverSize(true);
        }
      });
      overlay.addEventListener('mouseleave', () => {
        if (currentMode === 'collapsed') {
          overlay.classList.remove('hovered');
          window.electronAPI.setOverlayHoverSize(false);
        }
      });

      // Click on the orb dot to expand (for cases where hover doesn't trigger on small window)
      collapsedIndicator.addEventListener('click', (e) => {
        e.stopPropagation();
        if (currentMode === 'collapsed' && !overlay.classList.contains('hovered')) {
          overlay.classList.add('hovered');
          window.electronAPI.setOverlayHoverSize(true);
        }
      });

      // Collapse button click
      collapseBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        setMode('collapsed');
        window.electronAPI.setOverlayMode('collapsed');
      });

      function setMode(mode) {
        currentMode = mode;
        if (mode === 'collapsed') {
          overlay.classList.add('collapsed');
          overlay.classList.remove('hovered');
        } else {
          overlay.classList.remove('collapsed');
          overlay.classList.remove('hovered');
        }
      }

      // Listen for status updates
      window.electronAPI.onRecordingStatus((status) => {
        console.log('[OVERLAY] Status update received:', JSON.stringify(status));
        updateUI(status.state, status.duration, status.resolution, status.fps, status.inputState, status.mouseActivity);
      });

      // Listen for recording finished
      window.electronAPI.onRecordingFinish((result) => {
        console.log('Recording finished:', result);
        lastVideoPath = result.videoPath;
        // Show play button when recording finishes
        playBtn.style.display = 'flex';
      });

      function updateUI(state, dur, resolution, fps, inputState, mouseActivity) {
        duration = dur || 0;
        currentResolution = resolution;
        currentFps = fps;
        currentInputState = inputState;
        updateDuration();
        updateDetails();
        updateInputStatus();
        updateMouseActivity(mouseActivity);

        // Update both collapsed and expanded indicators
        indicator.className = 'indicator';
        collapsedIndicator.className = 'collapsed-indicator';
        collapsedState.className = 'collapsed-state';

        statusEl.className = 'status';
        pauseBtn.style.display = 'none';
        resumeBtn.style.display = 'none';
        playBtn.style.display = 'none';

        if (state === 'recording') {
          indicator.classList.add('recording');
          collapsedIndicator.classList.add('recording');
          collapsedState.classList.add('recording');
          collapsedState.textContent = 'REC';
          statusEl.classList.add('recording');
          statusEl.textContent = 'REC';
          pauseBtn.style.display = 'flex';
        } else if (state === 'paused') {
          indicator.classList.add('paused');
          collapsedIndicator.classList.add('paused');
          collapsedState.classList.add('paused');
          collapsedState.textContent = 'PAUSED';
          statusEl.classList.add('paused');
          statusEl.textContent = 'PAUSED';
          resumeBtn.style.display = 'flex';
        } else {
          statusEl.classList.add('ready');
          statusEl.textContent = 'READY';
          collapsedState.textContent = 'READY';
          detailsEl.textContent = '';
          inputStatusEl.innerHTML = '';
        }
      }

      function updateDuration() {
        const seconds = Math.floor(duration / 1000);
        const minutes = Math.floor(seconds / 60);
        const secs = seconds % 60;
        const timeStr = minutes.toString().padStart(2, '0') + ':' + secs.toString().padStart(2, '0');
        durationEl.textContent = timeStr;
        collapsedDuration.textContent = timeStr;
      }

      function updateDetails() {
        if (currentResolution && currentFps) {
          detailsEl.textContent = `${currentResolution.width}x${currentResolution.height} @ ${currentFps}fps`;
        } else {
          detailsEl.textContent = '';
        }
      }

      function updateMouseActivity(eventsPerSecond) {
        if (eventsPerSecond && eventsPerSecond > 0) {
          mouseActivityEl.innerHTML = `Mouse: <span>${eventsPerSecond}</span> ev/s`;
        } else {
          mouseActivityEl.innerHTML = '';
        }
      }

      function updateInputStatus() {
        console.log('[OVERLAY] updateInputStatus called, currentInputState:', JSON.stringify(currentInputState));

        // Show badges if any key is pressed OR mouse is pressed
        if (!currentInputState) {
          inputStatusEl.innerHTML = '';
          return;
        }

        const keys = currentInputState.pressedKeys || [];
        const mouseBtns = currentInputState.pressedMouseButtons || [];

        if (keys.length === 0 && mouseBtns.length === 0) {
          inputStatusEl.innerHTML = '';
          return;
        }

        let html = '';

        // Show key names (e.g., "Ctrl+A")
        if (keys.length > 0) {
          html += `<span class="input-badge active">${keys.join('+')}</span>`;
        }

        // Show mouse buttons: 1=L(左), 2=R(右), 3=M(中)
        if (mouseBtns.length > 0) {
          const btnNames = mouseBtns.map(b => b === 1 ? 'L' : b === 2 ? 'R' : b === 3 ? 'M' : `B${b}`);
          html += `<span class="input-badge active">M:${btnNames.join('+')}</span>`;
        }

        console.log('[OVERLAY] Setting inputStatusEl html:', html);
        inputStatusEl.innerHTML = html;
      }

      pauseBtn.onclick = () => window.electronAPI.pauseRecording();
      resumeBtn.onclick = () => window.electronAPI.resumeRecording();
      stopBtn.onclick = () => window.electronAPI.stopRecording();
      playBtn.onclick = () => {
        if (lastVideoPath) {
          window.electronAPI.openVideo(lastVideoPath);
        }
      };
    </script>
  </body>
</html>
