appId: com.screenrecorder.app
productName: Screen Recording Tool
copyright: Copyright © 2024

directories:
  output: release-portable
  buildResources: build

files:
  - dist/**/*
  - package.json

extraResources:
  - from: native/dist
    to: native/dist
    filter:
      - "**/*"
  - from: build/README.txt
    to: README.txt
  - from: build/vc_redist.x64.exe
    to: vc_redist.x64.exe

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: dir
      arch:
        - x64
  signAndEditExecutable: false
  artifactName: "${productName} Setup.${ext}"

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.video

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Video
